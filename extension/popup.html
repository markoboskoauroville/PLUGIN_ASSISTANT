<!doctype html>
<html><head><meta charset="utf-8"><title>Plugin Assistant (Mantra)</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#1d1d1f;--mut:#86868b;--line:#d2d2d7;--acc:#c48c50}
@media (prefers-color-scheme:dark){:root{--bg:#1c1a17;--fg:#f2ece2;--mut:#9a9288;--line:#3a352f}}
body{margin:0;width:380px;background:var(--bg);color:var(--fg);font:13px -apple-system,system-ui,sans-serif}
.row{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.row h1{font-size:14px;margin:0;flex:1}
.mut{color:var(--mut);font-size:11px}
button{background:none;border:0;color:var(--fg);font-weight:600;font-size:12px;font-family:inherit;cursor:pointer;padding:4px 6px}
button:hover:not(:disabled){text-decoration:underline;color:var(--acc)}
button:disabled{color:var(--mut);cursor:default}
#onoff{font-size:13px}
#status{padding:8px 14px;border-bottom:1px solid var(--line)}
.bad{color:#d33}
.meter{height:2px;background:var(--line);position:relative;margin:4px 14px}
.meter i{position:absolute;left:0;top:0;bottom:0;background:#2a9d4a;width:0}
.meter u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--fg);text-decoration:none}
.slot{display:flex;align-items:center;gap:4px;padding:6px 14px;border-bottom:1px solid var(--line)}
.slot .n{flex:1;min-width:0}.slot .n b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot.by b{text-decoration:line-through;color:var(--mut)}
#add{padding:8px 14px}
#q{width:100%;box-sizing:border-box;padding:6px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--fg)}
#res{max-height:180px;overflow:auto}
#res div{padding:5px 6px;cursor:pointer}#res div:hover{background:var(--line)}
footer{text-align:center;color:var(--mut);font-size:11px;padding:8px}
</style></head><body>
<div class="row"><h1>Plugin Assistant (Mantra)</h1><button id="onoff" disabled>ON</button><span class="mut">v2</span></div>
<div id="status" class="mut">looking for the host...</div>
<div class="mut" style="padding:4px 14px 0">IN</div><div class="meter"><i id="mi"></i><u id="pi"></u></div>
<div id="chain"></div>
<div id="add"><button id="addb">+ ADD PLUG-IN</button><div id="addbox" hidden><input id="q" placeholder="Search plug-ins"><div id="res"></div></div></div>
<div class="mut" style="padding:0 14px">OUT</div><div class="meter"><i id="mo"></i><u id="po"></u></div>
<div class="row"><button id="site">ENABLE ON THIS SITE</button><span class="mut" id="siteinfo"></span></div>
<footer>© 2026 Mantra Productions</footer>
<script src="popup.js"></script></body></html>
